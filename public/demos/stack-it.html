/* ---------- Game screen ---------- */
.qbar{position:absolute;left:3.6%;width:92.9%;top:68.9%;height:8.7%;border-radius:4cqw;background:#0d0f3acc;display:flex;align-items:center;justify-content:center;padding:0 2.5cqw;box-sizing:border-box;
  font-weight:500;font-size:1.62cqw;line-height:1.2;color:#fff;text-align:center;text-wrap:balance;z-index:1}
.clock{position:absolute;left:50.45%;top:7.4%;transform:translate(-50%,-50%);z-index:3;font-weight:600;font-size:4cqw;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.clock.low{color:#ffd5d5;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.08)}}

.chip{position:absolute;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;
  border-radius:999px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;font-size:1.2cqw;color:var(--ink);
  background:linear-gradient(180deg,#f6f9ff 0%,#e2eafb 55%,#b7cbef 100%);
  border:.2cqw solid #fff;box-shadow:0 .25cqw .5cqw #0006;
  transition:left .45s cubic-bezier(.3,.9,.3,1),top .45s cubic-bezier(.3,.9,.3,1),width .45s,height .45s,transform .2s,border-color .2s,box-shadow .2s,font-size .2s;
  user-select:none;cursor:pointer;z-index:2}
.chip.in-slot{font-size:1.3cqw}
.chip.focus,.chip.moving{border:.32cqw solid var(--gold);box-shadow:0 0 1.2cqw #ffc80066,0 .25cqw .5cqw #0006;z-index:4}
.chip.big{transform:scale(1.09);font-size:1.55cqw;z-index:5}
.ghost{position:absolute;box-sizing:border-box;border-radius:999px;border:.18cqw dashed #a3a8cc99;z-index:1;transition:opacity .2s}
.arrows{position:absolute;z-index:6;display:flex;flex-direction:column;justify-content:space-between;align-items:center;pointer-events:none;transition:top .3s}
.arrows i{width:0;height:0;border-left:1cqw solid transparent;border-right:1cqw solid transparent}
.arrows i.up{border-bottom:1.1cqw solid var(--gold-hi)}
.arrows i.dn{border-top:1.1cqw solid var(--gold-hi)}
.arrows i.up.off{border-bottom-color:var(--lav)}
.arrows i.dn.off{border-top-color:var(--lav)}
.hint{position:absolute;left:50%;top:81.6%;height:13%;transform:translateX(-50%);z-index:7;box-sizing:border-box;
  display:flex;align-items:center;gap:1cqw;padding:0 2cqw;border-radius:1.1cqw;background:#07071ae8;
  font-weight:500;font-size:1.85cqw;color:#fff;white-space:nowrap}
.hint .lbl{margin-right:.2cqw}
.key{display:inline-flex;align-items:center;justify-content:center;width:3.3cqw;height:3.3cqw;border-radius:.45cqw;background:#fff;color:#000;
  box-shadow:inset 0 -.3cqw 0 #c9c9d4;font-weight:600;font-size:1.75cqw}
.key svg{width:1.6cqw;height:1.6cqw}
.stage.finished .ghost{opacity:0}

/* ---------- Results screen (design frame 1920x1080) ---------- */
.screen{position:absolute;inset:0;z-index:10;opacity:0;pointer-events:none;transition:opacity .5s;background-position:center;background-size:100% 100%;background-repeat:no-repeat}

    mine:{x:113,w:501,tops:[197,325,453,581,709,837],h:116}};

  const stage=document.getElementById('stage');
  const ARROW_UP='<svg viewBox="0 0 20 20"><path d="M10 3 19 17H1z"/></svg>';
  const ARROW_DN='<svg viewBox="0 0 20 20"><path d="M10 17 1 3h18z"/></svg>';

  let myCount,round=0, total=0, roundPts=[];
  let slots, placed, focus, mode, moving, movingSlot, rFocus, rSel, rOrig, deadline, tickId, timers=[];
  let chips, ghosts, arrows, hint, clockEl, qbar, resScreen, roundScreen, mineEls, resLeft, resCenter, rbar, rsub;
  const RD=()=>ROUNDS[round];
  const pct=(v,of)=>v/of*100+'%';
  function later(fn,ms){timers.push(setTimeout(fn,ms))}
  function clearTimers(){timers.forEach(clearTimeout);timers=[]}

  function homePos(i){return {l:HOME.lefts[i%3],t:HOME.tops[Math.floor(i/3)],w:HOME.w,h:HOME.h}}
  function slotPos(s){return {l:SLOT.left,t:SLOT.tops[s],w:SLOT.width,h:SLOT.height}}
  function el(cls,parent,html){const d=document.createElement('div');d.className=cls;if(html!=null)d.innerHTML=html;(parent||stage).appendChild(d);return d}
  function box(d,x,y,w,h){Object.assign(d.style,{left:pct(x,R.W),top:pct(y,R.H),width:pct(w,R.W),height:pct(h,R.H)})}

  function build(){
    stage.innerHTML='';chips=[];ghosts=[];
    qbar=el('qbar');qbar.textContent=RD().q;
    clockEl=el('clock');
    RD().answers.forEach((a,i)=>{
      const p=homePos(i);
      const g=el('ghost');Object.assign(g.style,{left:p.l+'%',top:p.t+'%',width:p.w+'%',height:p.h+'%'});ghosts.push(g);
      const c=el('chip');c.textContent=a;c.addEventListener('click',()=>onChipClick(i));chips.push(c);
    });
    arrows=el('arrows','', '<i class="up"></i><i class="dn"></i>');arrows.hidden=true;
    hint=el('hint');hint.hidden=true;

    // results screen
    resScreen=el('screen results');
    el('rhead',resScreen,'SU’S STACK').style.left=pct(R.left.x+R.left.w/2,R.W);
    el('rhead',resScreen,'CORRECT STACK').style.left=pct(R.center.x+R.center.w/2,R.W);
    el('rhead',resScreen,'YOUR STACK').style.left=pct(R.mine.x+R.mine.w/2,R.W);
    myCount=el('rcount',resScreen);
    resLeft=[];resCenter=[];mineEls=[];
    for(let r=0;r<6;r++){
      const a=el('rtext su',resScreen);box(a,R.left.x,R.left.tops[r],R.left.w,R.left.h);resLeft.push(a);
      const b=el('rtext',resScreen);box(b,R.center.x,R.center.tops[r],R.center.w,R.center.h);resCenter.push(b);
      const m=el('mine',resScreen);box(m,R.mine.x,R.mine.tops[r],R.mine.w,R.mine.h);mineEls.push(m);
    }
    resScreen.addEventListener('click',()=>key('ok'));

    // round complete screen
    roundScreen=el('screen round');
    rbar=el('rbar',roundScreen);
    roundScreen.addEventListener('click',()=>key('ok'));
  }

  function startRound(){
    clearTimers();clearInterval(tickId);
    slots=Array(6).fill(null);placed=Array(6).fill(-1);
    focus=0;mode='pick';moving=-1;movingSlot=-1;rFocus=0;rSel=-1;
    build();render();
    deadline=Date.now()+ROUND_SECONDS*1000;tickId=setInterval(tick,200);tick();
  }
  function newGame(){round=0;total=0;roundPts=[];startRound()}

  function tick(){
    const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));
    clockEl.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
    clockEl.classList.toggle('low',left<=10&&left>0);
    if(left===0)timeUp();
  }

  const free=()=>slots.map((v,i)=>v===null?i:-1).filter(i=>i>=0);
  const unplaced=()=>RD().answers.map((_,i)=>i).filter(i=>placed[i]<0&&i!==moving);

  function setHint(label,ok){
    hint.hidden=false;
    hint.innerHTML='<span class="lbl">'+label+'</span><span class="key">'+ARROW_UP+'</span><span class="key">'+ARROW_DN+'</span><span class="lbl">'+ok+'</span><span class="key">Ok</span>';
  }

  function render(){
    chips.forEach((c,i)=>{
      let p,inSlot=false;
      if(i===moving){p=slotPos(movingSlot);inSlot=true}
      else if(placed[i]>=0){p=slotPos(placed[i]);inSlot=true}
      else p=homePos(i);
      Object.assign(c.style,{left:p.l+'%',top:p.t+'%',width:p.w+'%',height:p.h+'%'});
      c.classList.toggle('in-slot',inSlot);
      c.classList.toggle('moving',i===moving||(mode==='reorder'&&placed[i]===rSel));
      c.classList.toggle('focus',(mode==='pick'&&i===focus)||(mode==='review'&&placed[i]===rFocus));
      c.classList.toggle('big',mode==='review'&&placed[i]===rFocus);
      ghosts[i].style.opacity=(placed[i]>=0||i===moving)?1:0;
    });
    let a=-1,upOff=false,dnOff=false;
    if(mode==='place'){const f=free(),idx=f.indexOf(movingSlot);a=movingSlot;upOff=idx<=0;dnOff=idx>=f.length-1}
    if(mode==='reorder'){a=rSel;upOff=rSel<=0;dnOff=rSel>=5}
    if(a>=0){
      const p=slotPos(a);arrows.hidden=false;
      Object.assign(arrows.style,{left:(p.l+p.w+1)+'%',top:(p.t+0.2)+'%',height:(p.h-0.4)+'%'});
      arrows.children[0].classList.toggle('off',upOff);arrows.children[1].classList.toggle('off',dnOff);
    } else arrows.hidden=true;

    const full=mode==='review'||mode==='reorder';
    stage.classList.toggle('finished',full);
    if(mode==='review')setHint('Choose a block','OK pick it up');
    else if(mode==='reorder')setHint('Move','OK drop');
    else hint.hidden=true;
  }

  function startPlace(i){if(placed[i]>=0)return;moving=i;movingSlot=free()[0];mode='place';render()}

  function fix(){
    slots[movingSlot]=moving;placed[moving]=movingSlot;
    const from=moving;moving=-1;movingSlot=-1;
    const rest=unplaced();
    if(rest.length===1){
      const last=rest[0];mode='pick';focus=-1;render();
      later(()=>{if(mode!=='pick')return;const s=free()[0];slots[s]=last;placed[last]=s;mode='review';rFocus=0;render()},450);
      return;
    }
    focus=rest.find(i=>i>from);if(focus===undefined)focus=rest[0];
    mode='pick';render();
  }

  function movePick(dir){
    const rest=unplaced();if(!rest.length)return;
    const col=focus%3,row=Math.floor(focus/3);
    let best=null,bd=1e9;
    rest.forEach(i=>{
      if(i===focus)return;
      const c=i%3,r=Math.floor(i/3),dc=c-col,dr=r-row;
      const ok=(dir==='left'&&dc<0)||(dir==='right'&&dc>0)||(dir==='up'&&dr<0)||(dir==='down'&&dr>0);
      if(!ok)return;
      const d=(dir==='left'||dir==='right')?Math.abs(dc)+Math.abs(dr)*3:Math.abs(dr)+Math.abs(dc)*0.5;
      if(d<bd){bd=d;best=i}
    });
    if(best===null&&(dir==='left'||dir==='right')){const k=rest.indexOf(focus),n=rest.length;best=rest[(k+(dir==='right'?1:-1)+n)%n]}
    if(best!==null){focus=best;render()}
  }

  // time's up: whatever is placed counts
  function timeUp(){
    clearInterval(tickId);clearTimers();
    if(mode==='place'){slots[movingSlot]=moving;placed[moving]=movingSlot;moving=-1}
    rSel=-1;showResults();
  }

  function showResults(){
    mode='result';render();
    const rd=RD(),yours=slots.map(i=>i===null?'':rd.answers[i]);
    const n=yours.filter((a,r)=>a&&a===rd.key[r]).length;
    roundPts[round]=n===6?rd.full:n*rd.per;total+=roundPts[round];
    for(let r=0;r<6;r++){
      resLeft[r].textContent=rd.su[r];resLeft[r].classList.remove('match','miss');resCenter[r].textContent=rd.key[r];
      const m=mineEls[r];m.textContent=yours[r]||'—';m.className='mine hide'+(yours[r]?'':' empty');
    }
    resScreen.classList.add('show');
    resLeft.forEach((d,r)=>later(()=>{d.classList.add(rd.su[r]===rd.key[r]?'match':'miss')},500+r*350));
    mineEls.forEach((m,r)=>later(()=>{m.classList.remove('hide');if(yours[r])m.classList.add(yours[r]===rd.key[r]?'match':'miss')},700+r*350));
    myCount.innerHTML='<b>'+n+' of 6</b> in the right spot';
    myCount.classList.remove('on');
    later(()=>myCount.classList.add('on'),700+6*350);
    later(showComplete,700+6*350+3000);
    render();
  }

  function showComplete(){
    clearTimers();mode='complete';
    const last=round===ROUNDS.length-1;
    rbar.innerHTML='<div class="side">Round<b>'+(round+1)+'/'+ROUNDS.length+'</b></div><div class="mid">'+(last?'Game Complete!':'Round Complete!')+'</div><div class="side r">Score<b>'+total+'</b></div>';
    roundScreen.classList.add('show');
    if(!last)later(nextRound,6000);
    render();
  }

  function nextRound(){
    clearTimers();
    if(round<ROUNDS.length-1){round++;startRound()}else newGame();
  }

  function key(k){
    if(k==='reset'){newGame();return}
    if(mode==='pick'){
      if(k==='ok'&&focus>=0)startPlace(focus);
      else if(['up','down','left','right'].includes(k))movePick(k);
    } else if(mode==='place'){
      const f=free(),idx=f.indexOf(movingSlot);
      if(k==='up'&&idx>0){movingSlot=f[idx-1];render()}
      else if(k==='down'&&idx<f.length-1){movingSlot=f[idx+1];render()}
      else if(k==='ok')fix();
      else if(k==='back'){focus=moving;moving=-1;mode='pick';render()}
    } else if(mode==='review'){
      if(k==='up'&&rFocus>0){rFocus--;render()}
      else if(k==='down'&&rFocus<5){rFocus++;render()}
      else if(k==='ok'){rSel=rFocus;rOrig=slots.slice();mode='reorder';render()}
    } else if(mode==='reorder'){
      if((k==='up'&&rSel>0)||(k==='down'&&rSel<5)){
        const to=rSel+(k==='up'?-1:1);
        [slots[rSel],slots[to]]=[slots[to],slots[rSel]];
        placed[slots[rSel]]=rSel;placed[slots[to]]=to;rSel=to;render();
      } else if(k==='ok'){rFocus=rSel;rSel=-1;mode='review';render()}
      else if(k==='back'){slots=rOrig;slots.forEach((a,s)=>placed[a]=s);rSel=-1;mode='review';render()}
    } else if(mode==='result'){
      if(k==='ok')showComplete();
    } else if(mode==='complete'){
      if(k==='ok')nextRound();
    }
  }

  function onChipClick(i){
    if(mode==='pick'&&placed[i]<0){focus=i;startPlace(i)}
    else if(mode==='place'&&i===moving)fix();
    else if(mode==='review'&&placed[i]>=0){rFocus=placed[i];key('ok')}
    else if(mode==='reorder'&&placed[i]===rSel)key('ok');
  }

  document.addEventListener('keydown',e=>{
    const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'ok',Escape:'back',Backspace:'back'};
    const codes={13:'ok',461:'back',10009:'back',8:'back',27:'back'};
    const k=map[e.key]||codes[e.keyCode];
    if(!k)return;
    if(k==='ok'&&e.target.closest&&e.target.closest('button'))return; // native button click
    e.preventDefault();key(k);
  });
  // The catalog's screen diagram (same origin): jump to a stage, report the stage.
  function fillStack(){slots=RD().answers.map((_,i)=>i);slots.forEach((a,s)=>placed[a]=s);moving=-1;movingSlot=-1}
  window.catalogFlow={
    go(id){
      if(id==='game')round=ROUNDS.length-1;
      startRound();
      if(id==='place'){startPlace(0)}
      else if(id==='full'||id==='move'){fillStack();mode='review';rFocus=0;
        if(id==='move'){rSel=0;rOrig=slots.slice();mode='reorder'}render()}
      else if(id==='results'){fillStack();timeUp()}
      else if(id==='round'||id==='game'){fillStack();timeUp();showComplete()}
    },
    current(){
      return {pick:'pick',place:'place',review:'full',reorder:'move',result:'results',
        complete:round<ROUNDS.length-1?'round':'game'}[mode];
    }
  };

  // Called by the catalog card (same origin): its End timer / Restart buttons.
  window.stackIt={
    endTimer(){if(['pick','place','review','reorder'].includes(mode))timeUp()},
    restart(){newGame()}
  };
  newGame();
})();
</script>
